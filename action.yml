name: BrainChain review
description: Review each pull request with a frontier model, and pay only for a review that passes Jev's grade.
author: BrainChain
branding:
  icon: check-circle
  color: gray-dark

inputs:
  payer-key:
    description: Private key of the wallet that pays for reviews. Store it as a repository secret and keep only what you plan to spend in it.
    required: true
  pay-on:
    description: "base pays in USDC on Base with a signature alone; robinhood pays in USDG on Robinhood Chain after a one-time Permit2 approval."
    default: base
  network:
    description: mainnet, or testnet for test USDC on Base Sepolia or test USDG on Robinhood Chain testnet.
    default: mainnet
  max-price:
    description: The most one review may cost, in USDC or USDG. The wallet must hold at least this much.
    default: "1"
  wait-minutes:
    description: Minutes to wait for the graded review, from 1 to 300. The order keeps running either way.
    default: "20"
  review-bots:
    description: "true also reviews pull requests opened by bots, such as Dependabot."
    default: "false"
  github-token:
    description: Token used to read the diff and post the review. Needs pull-requests write.
    default: ${{ github.token }}

outputs:
  order:
    description: The BrainChain order id.
  task-id:
    description: The task's id on BrainChain.
  accepted:
    description: true once an accepted review is posted, false when Jev did not accept it. Empty when the job stops waiting first or skips the pull request.

runs:
  using: node24
  main: dist/index.js
