name: BrainChain review
description: Review each pull request with a frontier model, and pay only for a review that passes Jev's grade.
author: BrainChain
branding:
  icon: check-circle
  color: gray-dark

inputs:
  payer-key:
    description: Private key of the wallet that pays for reviews, from a repository secret. Fund that wallet with only what you plan to spend.
    required: true
  pay-on:
    description: "base pays in USDC on Base with a signature alone; robinhood pays in USDG on Robinhood Chain after a one-time Permit2 approval."
    default: base
  network:
    description: mainnet, or testnet for test USDC on Base Sepolia or test USDG on Robinhood Chain testnet.
    default: mainnet
  max-price:
    description: The most one review may cost, in USDC or USDG. The wallet must hold at least this much.
    default: "1"
  wait-minutes:
    description: Minutes to wait for the graded review, from 1 to 300, counted from when the action starts. The order keeps running either way.
    default: "20"
  review-bots:
    description: "true also reviews pull requests opened by bots, such as Dependabot."
    default: "false"
  github-token:
    description: "Token that reads the diff and posts the review. Needs pull-requests: write, and contents: read for wider context."
    default: ${{ github.token }}

outputs:
  order:
    description: The BrainChain order id, set once paid, when a re-run waits on a paid order, or when the commit already has a review. Also set when the job stops waiting.
  task-id:
    description: The task's id on BrainChain, set once the task is posted, including when the job stops waiting after that.
  accepted:
    description: true once an accepted review is posted, or when the commit already has one; false when Jev did not accept it. Empty when the job stops waiting first or skips the pull request for any other reason.

runs:
  using: node24
  main: dist/index.js
