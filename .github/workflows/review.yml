# Reviews this repository's own pull requests on BrainChain testnet, paid in test USDG on Robinhood Chain testnet.
name: Review
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: brainchain-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          payer-key: ${{ secrets.BRAINCHAIN_TESTNET_PAYER_KEY }}
          network: testnet
          pay-on: robinhood
