# Reviews this repository's own pull requests on BrainChain mainnet, paid in USDC on Base.
name: Review
on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          payer-key: ${{ secrets.BRAINCHAIN_PAYER_KEY }}
